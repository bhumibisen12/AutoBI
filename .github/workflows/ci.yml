name: AutoBI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-fast-tests:
    name: Ruff Lint + Fast Unit & Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Run fast pytest suite (excluding slow E2E / DL / AppTest)
        env:
          LLM_PROVIDER: mock
        run: pytest -m "not slow"

      - name: Run RAG retrieval evaluation sanity check
        run: python evals/rag_eval.py

