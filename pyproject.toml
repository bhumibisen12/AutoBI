[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autobi"
version = "0.1.0"
description = "AutoBI: Generate verified Power BI PBIP projects from datasets and natural language."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
    "scikit-learn>=1.5.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.0",
    "jsonschema>=4.23.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "charset-normalizer>=3.3.0",
    "chromadb>=0.5.0",
    "langgraph>=0.2.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "jupyter>=1.1.0",
]
dl = [
    "torch>=2.5.0",
]
faiss = [
    "faiss-cpu>=1.9.0",
]

[tool.setuptools.packages.find]
include = ["app*", "core*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "output", ".venv", "venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
markers = [
    "slow: marks slow end-to-end, ML/DL, or Streamlit AppTest tests (deselect with '-m \"not slow\"')",
]

